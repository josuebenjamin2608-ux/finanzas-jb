<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Finanzas JB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{
  --desk:#E4E8EE;
  --bg:#F3F5F8;
  --surface:#FFFFFF;
  --surface-2:#EDF0F5;
  --ink:#121A26;
  --muted:#5B6576;
  --faint:#8A93A3;
  --line:#E1E5EC;
  --accent:#2B50D6;
  --accent-ink:#FFFFFF;
  --accent-soft:#E6ECFF;
  --pos:#13855B;
  --neg:#B42318;
  --warn:#8A4B00;
  --warn-bg:#FFF3DC;
  --warn-line:#F2D39A;
  --scrim:rgba(18,26,38,.38);
  --shadow:0 1px 2px rgba(18,26,38,.06),0 8px 24px rgba(18,26,38,.08);
  --display:"Bricolage Grotesque","Figtree",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --desk:#080B10;--bg:#0E1218;--surface:#171C24;--surface-2:#1F2530;--ink:#EEF1F6;--muted:#9AA3B2;--faint:#6E7788;--line:#262D38;
    --accent:#7E9BFF;--accent-ink:#0B1020;--accent-soft:#1D2750;--pos:#4CC38A;--neg:#FF7A6E;--warn:#F0B254;--warn-bg:#2B2110;--warn-line:#5A4318;
    --scrim:rgba(0,0,0,.55);--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --desk:#080B10;--bg:#0E1218;--surface:#171C24;--surface-2:#1F2530;--ink:#EEF1F6;--muted:#9AA3B2;--faint:#6E7788;--line:#262D38;
  --accent:#7E9BFF;--accent-ink:#0B1020;--accent-soft:#1D2750;--pos:#4CC38A;--neg:#FF7A6E;--warn:#F0B254;--warn-bg:#2B2110;--warn-line:#5A4318;
  --scrim:rgba(0,0,0,.55);--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--desk);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}

.stage{height:100%;display:flex;flex-direction:column;align-items:center}
.proto{width:100%;max-width:430px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 16px;font-size:12px;color:var(--muted);background:var(--desk)}
.proto b{color:var(--ink);font-weight:600}
.proto button{padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:12px;font-weight:600}
.device{position:relative;width:100%;max-width:430px;flex:1;min-height:0;overflow:hidden;background:var(--bg)}
@media (min-width:600px) and (min-height:760px){
  .stage{justify-content:center;gap:10px;padding-block:16px}
  .device{flex:none;height:min(860px,calc(100% - 60px));border-radius:34px;border:8px solid #0B0F14;box-shadow:0 30px 80px rgba(10,15,25,.25)}
  .proto{background:transparent}
}

.screen{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;padding:0 18px 120px}
.screen.no-tabs{padding-bottom:40px}
.topbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;min-height:56px;margin:0 -18px;padding:8px 12px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.topbar h1{font-family:var(--display);font-size:20px;font-weight:700;margin:0;flex:1;letter-spacing:-.01em}
.topbar.plain{padding-inline:18px}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}
.iconbtn:hover{background:var(--surface-2)}
.iconbtn svg{width:22px;height:22px}
.wordmark{font-family:var(--display);font-weight:800;font-size:19px;letter-spacing:-.02em;flex:1}
.wordmark span{color:var(--accent)}

.label{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.section{margin-top:26px}
.section-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.section-head .link{font-size:14px;font-weight:600;color:var(--accent)}
.muted{color:var(--muted)}
.small{font-size:13px}

/* Inicio */
.hero{padding-top:8px}
.hero-tap{display:block;text-align:left;width:100%}
.big{font-family:var(--display);font-weight:700;font-size:46px;line-height:1.02;letter-spacing:-.03em;margin:6px 0 2px}
.big small{font-size:.5em;font-weight:600;vertical-align:.55em;margin-right:2px;color:var(--muted)}
.debt-row{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding:12px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.debt-row .v{font-weight:700;font-size:17px}
.warn{display:flex;gap:10px;align-items:flex-start;margin-top:12px;padding:12px 14px;border-radius:14px;background:var(--warn-bg);border:1px solid var(--warn-line);color:var(--warn);font-size:13.5px}
.warn svg{flex:none;width:18px;height:18px;margin-top:1px}
.warn b{font-weight:700}
.chip-prov{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;background:var(--warn-bg);color:var(--warn);font-size:11.5px;font-weight:700;border:1px solid var(--warn-line);white-space:nowrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
.ask h3{margin:0 0 4px;font-size:16px;font-weight:700}
.ask .ctx{font-size:13px;color:var(--muted);margin-bottom:12px}
.amount-input{display:flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:12px;padding:0 12px;background:var(--bg)}
.amount-input span{font-weight:700;color:var(--muted)}
.amount-input input{border:0;background:transparent;padding:12px 0;width:100%;font-size:18px;font-weight:600;outline:none;font-variant-numeric:tabular-nums}
.amount-input:focus-within{border-color:var(--accent)}
.row-btns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 18px;border-radius:12px;font-weight:700;font-size:15px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.quiet{background:var(--surface-2)}
.btn.danger{background:color-mix(in srgb,var(--neg) 14%,transparent);color:var(--neg)}
.btn.block{width:100%}
.btn svg{width:18px;height:18px}
.result-tap{display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left}
.result-tap .v{font-family:var(--display);font-size:24px;font-weight:700;letter-spacing:-.02em}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.pend{display:flex;align-items:center;gap:10px}
.pend .q{flex:1;min-width:0}
.pend .q div:first-child{font-weight:600}

/* Listas de movimientos */
.list{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.mv{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;text-align:left;border-top:1px solid var(--line)}
.mv:first-child{border-top:0}
.mv:hover{background:var(--surface-2)}
.mv .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--surface-2);color:var(--muted)}
.mv .ic svg{width:19px;height:19px}
.mv .ic.in{color:var(--pos);background:color-mix(in srgb,var(--pos) 12%,transparent)}
.mv .ic.tr{color:var(--accent);background:var(--accent-soft)}
.mv .t{flex:1;min-width:0}
.mv .t .d{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mv .t .s{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mv .a{text-align:right;flex:none}
.mv .a .m{font-weight:700;font-variant-numeric:tabular-nums}
.mv .a .acc{font-size:12.5px;color:var(--muted)}
.badges{display:flex;gap:4px;margin-top:3px;flex-wrap:wrap}
.badge{font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.badge.unc{background:var(--warn-bg);color:var(--warn)}
.badge.ref{background:color-mix(in srgb,var(--pos) 13%,transparent);color:var(--pos)}
.badge.adj{background:var(--accent-soft);color:var(--accent)}
.day{margin:20px 2px 8px;display:flex;justify-content:space-between;font-size:13px;font-weight:700;color:var(--muted)}
.day:first-of-type{margin-top:8px}

.monthsel{display:flex;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px}
.monthsel b{font-family:var(--display);font-size:17px;font-weight:700}
.monthsel .iconbtn:disabled{opacity:.3;cursor:default}
.filters{display:flex;gap:8px;margin-top:10px;overflow-x:auto;padding-bottom:2px}
.fsel{appearance:none;-webkit-appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 28px 7px 12px;font-size:13px;font-weight:600;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 15px) 52%,calc(100% - 10px) 52%;background-size:5px 5px;background-repeat:no-repeat}
.fsel.on{border-color:var(--accent);color:var(--accent);background-color:var(--accent-soft)}
.fchip{display:inline-flex;align-items:center;gap:6px;padding:7px 10px 7px 12px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:13px;font-weight:700;white-space:nowrap}
.fchip svg{width:14px;height:14px}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}

/* Tab bar y registrar */
.tabbar{position:absolute;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(3,1fr);background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 8px calc(8px + env(safe-area-inset-bottom,0px))}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:12px;font-weight:600;color:var(--faint);border-radius:12px}
.tab svg{width:23px;height:23px}
.tab.on{color:var(--accent)}
.fab{position:absolute;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:21;display:flex;align-items:center;gap:8px;height:56px;padding:0 22px 0 18px;border-radius:18px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:16px;box-shadow:0 10px 24px color-mix(in srgb,var(--accent) 35%,transparent)}
.fab svg{width:22px;height:22px}

/* Hoja */
.layer{position:absolute;inset:0;z-index:40;display:flex;flex-direction:column;justify-content:flex-end}
.scrim{position:absolute;inset:0;background:var(--scrim);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);animation:fade .2s ease}
.sheet{position:relative;background:var(--surface);border-radius:26px 26px 0 0;max-height:92%;overflow-y:auto;padding:8px 18px calc(20px + env(safe-area-inset-bottom,0px));animation:up .26s cubic-bezier(.2,.8,.2,1);box-shadow:0 -10px 40px rgba(0,0,0,.15)}
@keyframes up{from{transform:translateY(40%);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}}
@media (prefers-reduced-motion:reduce){.sheet,.scrim{animation:none}.wave i{animation:none!important}}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 6px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.sheet-head .label{margin:0}
.phrase{display:flex;align-items:flex-start;gap:8px;padding:12px 14px;border-radius:14px;background:var(--surface-2);font-size:15px}
.phrase svg{width:18px;height:18px;flex:none;margin-top:2px;color:var(--muted)}
.phrase q{quotes:"“" "”"}
.kind{display:inline-flex;align-items:center;gap:6px;margin-top:16px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:800;letter-spacing:.06em}
.kind.g{background:var(--surface-2);color:var(--ink)}
.kind.i{background:color-mix(in srgb,var(--pos) 13%,transparent);color:var(--pos)}
.kind.t{background:var(--accent-soft);color:var(--accent)}
.kind.a{background:var(--warn-bg);color:var(--warn)}
.sheet .amt{display:block;text-align:left;font-family:var(--display);font-size:50px;font-weight:700;letter-spacing:-.03em;line-height:1.05;margin:6px 0 10px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.field{display:block;text-align:left;padding:10px 12px;border-radius:12px;border:1px solid var(--line);min-width:0}
.field:hover{border-color:var(--faint)}
.field.wide{grid-column:1/-1}
.field .k{font-size:12px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px}
.field .v{font-weight:700;margin-top:2px;overflow:hidden;text-overflow:ellipsis}
.dot{width:7px;height:7px;border-radius:50%;background:var(--warn);display:inline-block}
.conseq{margin-top:12px;padding:12px 14px;border-radius:14px;border:1px dashed var(--line);font-size:14px;display:grid;gap:6px}
.conseq .l{display:flex;gap:8px;align-items:flex-start}
.conseq svg{width:17px;height:17px;flex:none;margin-top:1px;color:var(--muted)}
.question{margin-top:14px;padding:14px;border-radius:14px;background:var(--accent-soft)}
.question p{margin:0 0 10px;font-weight:700}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{padding:9px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;font-size:14px}
.opt.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.picker{margin-top:12px;padding:12px;border-radius:14px;background:var(--surface-2)}
.picker .label{display:block;margin-bottom:8px}
.sheet-actions{display:grid;grid-template-columns:1fr 2fr;gap:10px;margin-top:16px}
.done{text-align:center;padding:18px 0 6px}
.done .ok{width:64px;height:64px;border-radius:50%;margin:0 auto 12px;display:grid;place-items:center;background:color-mix(in srgb,var(--pos) 15%,transparent);color:var(--pos)}
.done .ok svg{width:32px;height:32px}
.done h3{font-family:var(--display);font-size:24px;margin:0 0 4px}
.timer{height:4px;border-radius:9px;background:var(--surface-2);overflow:hidden;margin:16px 0 4px}
.timer i{display:block;height:100%;background:var(--accent);animation:shrink 3s linear forwards}
@keyframes shrink{from{width:100%}to{width:0}}
.wave{display:flex;gap:5px;align-items:center;justify-content:center;height:70px;margin:10px 0}
.wave i{width:6px;border-radius:9px;background:var(--accent);animation:w 1s ease-in-out infinite}
.wave i:nth-child(2){animation-delay:.1s}.wave i:nth-child(3){animation-delay:.2s}.wave i:nth-child(4){animation-delay:.3s}.wave i:nth-child(5){animation-delay:.4s}
@keyframes w{0%,100%{height:14px}50%{height:54px}}
textarea.ta{width:100%;min-height:84px;resize:none;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--bg);font-size:17px;outline:none}
textarea.ta:focus{border-color:var(--accent)}
.note{font-size:12.5px;color:var(--muted);margin-top:8px}

/* Detalles */
.detail-hero{padding:6px 0 4px}
.detail-hero .big{font-size:40px}
.kv{background:var(--surface);border:1px solid var(--line);border-radius:18px}
.kv .r{display:flex;justify-content:space-between;gap:12px;padding:12px 14px;border-top:1px solid var(--line)}
.kv .r:first-child{border-top:0}
.kv .r .k{color:var(--muted)}
.kv .r .v{font-weight:600;text-align:right}
.kv .r.tot{font-weight:700}
.kv .r.tot .k{color:var(--ink)}
.effect{margin-top:14px;padding:14px;border-radius:14px;background:var(--accent-soft);color:var(--ink);font-size:14.5px;display:flex;gap:10px}
.effect svg{width:18px;height:18px;flex:none;color:var(--accent);margin-top:1px}
.linkrow{display:flex;align-items:center;gap:10px;width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);text-align:left;margin-top:10px}
.linkrow .t{flex:1}
.linkrow .t div:last-child{font-size:13px;color:var(--muted)}
.linkrow svg{width:18px;height:18px;color:var(--muted);flex:none}
.actions{display:grid;gap:8px;margin-top:22px}
.actbtn{display:flex;align-items:center;gap:12px;width:100%;padding:14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-weight:600;text-align:left}
.actbtn svg{width:20px;height:20px;color:var(--muted);flex:none}
.actbtn.danger{color:var(--neg)}.actbtn.danger svg{color:var(--neg)}
.actbtn .sub{display:block;font-weight:500;font-size:13px;color:var(--muted)}
.confirm{margin-top:8px;padding:14px;border-radius:14px;border:1.5px solid var(--neg);background:var(--surface)}
.confirm p{margin:0 0 4px;font-weight:700}

/* Cuentas */
.patri{display:flex;justify-content:space-between;align-items:center;padding:10px 2px 2px;color:var(--muted);font-size:14px}
.patri b{color:var(--ink);font-size:15px}
.grp{margin-top:22px}
.grp-head{display:flex;flex-direction:column;gap:2px;margin:0 2px 8px}
.grp-head .label{color:var(--ink)}
.grp-head .sub{font-size:13px;color:var(--muted);font-weight:600}
.acc{display:flex;align-items:center;gap:12px;width:100%;padding:13px 14px;border-top:1px solid var(--line);text-align:left}
.acc:first-child{border-top:0}
.acc:hover{background:var(--surface-2)}
.acc .n{flex:1;min-width:0}
.acc .n div:first-child{font-weight:600}
.acc .w{font-size:12.5px;color:var(--muted)}
.acc .m{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.acc .av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);font-weight:700;font-size:14px;color:var(--muted);flex:none}
.newacc{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:22px;padding:14px;border-radius:14px;border:1.5px dashed var(--line);font-weight:700;color:var(--accent)}
.newacc svg{width:18px;height:18px}

/* Formularios */
.fgroup{margin-top:18px}
.fgroup > .label{display:block;margin-bottom:8px}
.tinput{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--surface);font-size:17px;outline:none}
.tinput:focus{border-color:var(--accent)}
.hint{font-size:12.5px;color:var(--muted);margin-top:6px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg .opt{border-radius:12px;text-align:left;padding:10px 12px}
.seg .opt small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.nosabe{display:flex;align-items:center;gap:8px;margin-top:10px;font-weight:600;font-size:14px}
.nosabe input{width:18px;height:18px;accent-color:var(--accent)}

/* Primer uso */
.pu{padding-top:24px}
.steps{display:flex;gap:6px;margin-bottom:22px}
.steps i{flex:1;height:4px;border-radius:9px;background:var(--line)}
.steps i.on{background:var(--accent)}
.pu h2{font-family:var(--display);font-size:30px;line-height:1.1;letter-spacing:-.02em;margin:0 0 6px;text-wrap:balance}
.pu p.lead{color:var(--muted);margin:0 0 18px}
.pick{display:flex;align-items:center;gap:12px;width:100%;padding:13px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);text-align:left;margin-bottom:8px}
.pick.on{border-color:var(--accent);background:var(--accent-soft)}
.pick .n{flex:1}
.pick .n div:last-child{font-size:12.5px;color:var(--muted)}

(function(){

/* ---------- Iconos ---------- */

/* ---------- Datos ficticios ---------- */

  {id:'m8', d:'2026-09-20', t:'10:02', type:'TRANSFERENCIA', desc:'Pago tarjeta Visa', amt:450000, from:'bancolombia', to:'visa', phrase:'pagué la tarjeta 450 mil desde bancolombia'},
  {id:'m9', d:'2026-09-20', t:'10:05', type:'TRANSFERENCIA', desc:'Aparté para ahorro', amt:300000, from:'bancolombia', to:'ahorro', phrase:'aparté 300 mil para el ahorro'},

  {id:'m12', d:'2026-09-14', t:'16:40', type:'TRANSFERENCIA', desc:'Laura me prestó', amt:40000, from:'laura', to:'efectivo', phrase:'laura me prestó 40 mil'},
  {id:'m13', d:'2026-09-12', t:'22:10', type:'GASTO', desc:'Cena de cumpleaños', cat:'Comida', sub:'Restaurantes', amt:120000, acc:'visa', refundedBy:'m6', phrase:'cena de cumpleaños 120 mil con la visa'},
  {id:'m14', d:'2026-09-10', t:'07:00', type:'GASTO', desc:'Cuota de manejo', cat:'Financieros', amt:45000, acc:'visa', phrase:'cuota de manejo visa 45 mil'},
  {id:'m15', d:'2026-09-08', t:'15:30', type:'GASTO', desc:'Consulta médica', cat:'Salud', amt:85000, acc:'efectivo', phrase:'consulta médica 85 mil en efectivo'},
  {id:'m16', d:'2026-09-05', t:'08:30', type:'GASTO', desc:'Arriendo', cat:'Vivienda', sub:'Arriendo', amt:1100000, acc:'bancolombia', phrase:'arriendo un millón cien'},
  {id:'m17', d:'2026-09-01', t:'08:12', type:'AJUSTE', motivo:'apertura', desc:'Saldo inicial', amt:1328000, acc:'bancolombia'}
];
// arreglar ids: el reembolso m6 apunta a la cena m13
M.find(m=>m.id==='m6').link='m13';

/* ---------- Estado de la interfaz ---------- */
const S = {
  stack:[{s:'inicio'}],
  month:'2026-09',
  filter:{acc:'', cat:''},
  askLater:false,
  pendiente:{phrase:'gasolina 50 mil', open:true},
  deleted:new Set(),
  classified:{},
  habitual:'bancolombia',
  ui:{},           // estado temporal por pantalla
  sheet:null,
  pu:{step:1, sel:{efectivo:true, bancolombia:true, nequi:true, visa:true}, amt:{efectivo:'150.000', bancolombia:'1.328.000', visa:'864.000'}, unk:{nequi:true}, hab:'bancolombia'},
  form:null
};

/* ---------- Utilidades ---------- */
const fmt = n => '$' + String(Math.round(Math.abs(n))).replace(/\B(?=(\d{3})+(?!\d))/g,'.');
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const acc = id => A.find(a=>a.id===id);
const mov = id => M.find(m=>m.id===id);
const live = () => M.filter(m=>!S.deleted.has(m.id));
const catOf = m => S.classified[m.id] || m.cat;
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const DIAS = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const dparts = s => { const [y,m,d]=s.split('-').map(Number); return {y,m,d,wd:new Date(Date.UTC(y,m-1,d)).getUTCDay()}; };
const monthName = ym => { const [y,m]=ym.split('-').map(Number); return MESES[m-1][0].toUpperCase()+MESES[m-1].slice(1)+' '+y; };
const dayLabel = s => { if(s===TODAY) return 'Hoy'; if(s==='2026-09-25') return 'Ayer'; const p=dparts(s); return DIAS[p.wd][0].toUpperCase()+DIAS[p.wd].slice(1)+' '+p.d+' de '+MESES[p.m-1]; };
const shortDate = s => { const p=dparts(s); return p.d+' '+MESES[p.m-1].slice(0,3); };
const longDate = s => { const p=dparts(s); return DIAS[p.wd]+' '+p.d+' de '+MESES[p.m-1]+' de '+p.y; };
const initials = n => n.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();

// Efecto de un movimiento sobre una cuenta (solo para mostrar datos ficticios coherentes)
function delta(m, id){
  if(m.type==='AJUSTE') return 0;
  if(m.type==='GASTO') return m.acc===id ? -m.amt : 0;
  if(m.type==='INGRESO'||m.type==='REEMBOLSO') return m.acc===id ? m.amt : 0;
  if(m.type==='TRANSFERENCIA') return (m.to===id?m.amt:0) - (m.from===id?m.amt:0);
  return 0;
}
function flows(id){ let inn=0,out=0; live().forEach(m=>{const d=delta(m,id); if(d>0) inn+=d; else out-=d;}); return {inn,out}; }
function bal(a){ const f=flows(a.id); return (a.ap||0)+f.inn-f.out; }
const active = () => A.filter(a=>!a.archived);
const pendingAccs = () => active().filter(a=>a.pending);
function totals(){
  const act=active();
  const disp=act.filter(a=>a.cls==='disp').reduce((s,a)=>s+bal(a),0);
  const tarj=act.filter(a=>a.cls==='deuda'&&a.sub==='tarjeta').reduce((s,a)=>s+bal(a),0);
  const patr=act.reduce((s,a)=>s+bal(a),0);
  return {disp,tarj,patr};
}
function words(a, b){
  if(b===undefined) b=bal(a);
  if(a.cls==='persona'){ if(b>0) return {w:'Te debe', v:fmt(b)}; if(b<0) return {w:'Le debes', v:fmt(b)}; return {w:'A paz y salvo', v:''}; }
  if(a.cls==='deuda'){ if(b<0) return {w:'Debes', v:fmt(b)}; if(b>0) return {w:'A tu favor', v:fmt(b)}; return {w:'A paz y salvo', v:''}; }
  if(a.cls==='ahorro') return {w:'Apartado', v:fmt(b)};
  if(b<0) return {w:'En negativo', v:fmt(b)};
  return {w:'Tienes', v:fmt(b)};
}
function subtypeLabel(a){ return a.cls==='deuda' ? (a.sub==='tarjeta'?'Tarjeta de crédito':'Crédito') : CLS[a.cls]; }

function monthResult(ym){
  const ms = live().filter(m=>m.d.startsWith(ym));
  const ing = ms.filter(m=>m.type==='INGRESO').reduce((s,m)=>s+m.amt,0);
  const cats = {};
  ms.forEach(m=>{
    if(m.type!=='GASTO' && m.type!=='REEMBOLSO') return;
    const c = catOf(m) || '__unc';
    const sign = m.type==='GASTO'?1:-1;
    cats[c] = cats[c] || {total:0, subs:{}, ref:0, n:0};
    cats[c].total += sign*m.amt; cats[c].n++;
    if(m.type==='REEMBOLSO') cats[c].ref += m.amt;
    if(m.sub && c!=='__unc') cats[c].subs[m.sub]=(cats[c].subs[m.sub]||0)+sign*m.amt;
  });
  const gasto = Object.values(cats).reduce((s,c)=>s+c.total,0);
  const tr = ms.filter(m=>m.type==='TRANSFERENCIA');
  const sumT = f => tr.filter(f).reduce((s,m)=>s+m.amt,0);
  const not = {
    tarjeta: sumT(m=>acc(m.to)&&acc(m.to).cls==='deuda'),
    apartado: sumT(m=>acc(m.to)&&acc(m.to).cls==='ahorro'),
    cuentas: sumT(m=>acc(m.from).cls==='disp'&&acc(m.to).cls==='disp'),
    personas: sumT(m=>acc(m.from).cls==='persona'||acc(m.to).cls==='persona'),
    ajustes: ms.filter(m=>m.type==='AJUSTE').length
  };
  return {ing, gasto, res:ing-gasto, cats, not, count:ms.length};
}

/* Descripción de filas */
function rowTitle(m){
  if(m.type==='TRANSFERENCIA') return m.desc || (acc(m.from).name+' → '+acc(m.to).name);
  return m.desc;
}
function rowSub(m){
  if(m.type==='TRANSFERENCIA') return acc(m.from).name+' → '+acc(m.to).name;
  if(m.type==='AJUSTE') return 'Ajuste de apertura';
  const c=catOf(m);
  if(!c) return 'Sin categoría';
  return c + (m.sub && !S.classified[m.id] ? ' · '+m.sub : '');
}
function rowAmount(m, ctxAcc){
  if(ctxAcc){ const d=m.type==='AJUSTE'? m.amt : delta(m,ctxAcc); return `<span class="${d>0?'pos':''}">${d>0?'+':d<0?'−':''}${fmt(d)}</span>`; }
  if(m.type==='GASTO') return '−'+fmt(m.amt);
  if(m.type==='INGRESO'||m.type==='REEMBOLSO') return `<span class="pos">+${fmt(m.amt)}</span>`;
  return `<span class="muted">${fmt(m.amt)}</span>`;
}
function rowAcc(m){
  if(m.type==='TRANSFERENCIA') return 'Transferencia';
  return acc(m.acc).name;
}
function rowIcon(m){
  if(m.type==='INGRESO'||m.type==='REEMBOLSO') return `<span class="ic in">${I('in')}</span>`;
  if(m.type==='TRANSFERENCIA') return `<span class="ic tr">${I('swap')}</span>`;
  if(m.type==='AJUSTE') return `<span class="ic tr">${I('scale')}</span>`;
  return `<span class="ic">${I('out')}</span>`;
}
function rowBadges(m){
  const b=[];

  return b.length?`<div class="badges">${b.join('')}</div>`:'';
}

function effectText(m){
  const c=catOf(m);
  if(m.type==='GASTO'){
    const a=acc(m.acc);
    const lead = c?`Cuenta como gasto de ${c} en ${MESES[dparts(m.d).m-1]}.`:'Cuenta como gasto del mes, todavía sin categoría.';
    if(a.cls==='deuda') return `${lead} Tu deuda con ${a.name} sube ${fmt(m.amt)}.`;
    return `${lead} ${a.name} baja ${fmt(m.amt)}.`;
  }
  if(m.type==='INGRESO') return `Cuenta como ingreso de ${c}. ${acc(m.acc).name} sube ${fmt(m.amt)}.`;
  if(m.type==='REEMBOLSO') return `Se resta del gasto de ${c} de ${MESES[dparts(m.d).m-1]}, el mes en que llegó. ${acc(m.acc).name} sube ${fmt(m.amt)}.`;
  if(m.type==='AJUSTE') return `No cuenta como gasto ni ingreso. Es el saldo con el que empezó ${acc(m.acc).name}.`;
  const f=acc(m.from), t=acc(m.to);
  if(t.cls==='persona'){ const w=words(t); return `No cuenta como gasto. ${t.name} ${w.w.toLowerCase()} ${w.v}.`; }
  if(f.cls==='persona'){ const w=words(f); return `No cuenta como ingreso. ${w.w==='Le debes'?'Le debes '+w.v+' a '+f.name:f.name+': '+w.w.toLowerCase()}.`; }
  if(t.cls==='deuda') return `No cuenta como gasto. Es un pago de deuda: ahora debes ${fmt(bal(t))} en ${t.name}.`;
  if(t.cls==='ahorro') return `No cuenta como gasto. Es plata apartada: sale de Disponible y queda en ${t.name}.`;
  return `No cuenta como gasto. Solo cambia de cuenta: ${f.name} baja y ${t.name} sube ${fmt(m.amt)}.`;
}

  if(m.type==='GASTO'||m.type==='INGRESO'||m.type==='REEMBOLSO') rows.push(['Categoría', c ? c+(m.sub&&!S.classified[m.id]?' · '+m.sub:'') : '<span class="badge unc">Sin clasificar</span>']);

    <div class="muted">${esc(rowTitle(m))}</div>

  <div class="section kv">${rows.map(r=>r[2]?`<div class="r"><span class="k">${r[0]}</span><button class="v" type="button" data-a="go" data-s="cuentadetalle" data-id="${r[2]}" style="color:var(--accent)">${r[1]} ›</button></div>`:`<div class="r"><span class="k">${r[0]}</span><span class="v">${r[1]}</span></div>`).join('')}</div>
  ${linked?`<button class="linkrow" type="button" data-a="go" data-s="movdetalle" data-id="${linked.id}">${I('link')}<span class="t"><div>${m.refundedBy?'Reembolsado el '+shortDate(linked.d):'Compra enlazada: '+esc(linked.desc)}</div><div>${m.refundedBy?esc(linked.desc)+' · +'+fmt(linked.amt):shortDate(linked.d)+' · '+fmt(linked.amt)}</div></span>${I('chev')}</button>`:''}
  <div class="actions">
    ${m.type==='GASTO'&&!c?`<button class="actbtn" type="button" data-a="ui" data-k="classify">${I('tag')}<span>Clasificar<span class="sub">Elige su categoría</span></span></button>
      ${u.classify?`<div class="picker"><span class="label">Categoría</span><div class="opts">${CATS.map(x=>`<button class="opt" type="button" data-a="classify" data-id="${m.id}" data-v="${x.n}">${x.n}</button>`).join('')}</div></div>`:''}`:''}
    ${m.type==='AJUSTE'

function deduce(name){
  const n=name.toLowerCase();
  if(/visa|master|tarjeta|amex|diners/.test(n)) return {cls:'deuda', sub:'tarjeta'};
  if(/cr[eé]dito|pr[eé]stamo|hipoteca|libranza/.test(n)) return {cls:'deuda', sub:'credito'};
  if(/cdt|inversi[oó]n|fondo|acciones/.test(n)) return {cls:'ahorro'};
  if(/ahorro|bolsillo|colch[oó]n|alcanc/.test(n)) return {cls:'disp', askAhorro:true};
  return {cls:'disp'};
}

function openSheet(m, id){

  else if(m==='pend') S.sheet={state:'card', phrase:S.pendiente.phrase, d:{type:'GASTO', amt:50000, cat:'Transporte', sub:'Gasolina', acc:S.habitual, date:TODAY}, prov:{acc:1}, fromPend:true};
  else if(m==='edit'){ const x=mov(id); S.sheet={state:'card', edit:id, phrase:x.phrase||'', d:{type:x.type, amt:x.amt, cat:catOf(x), sub:x.sub, acc:x.acc, from:x.from, to:x.to, date:x.d}, prov:{}}; }

function conseq(d){
  const L=[];
  const line=(ic,t)=>L.push(`<div class="l">${I(ic)}<span>${t}</span></div>`);
  const after=(id,dl)=>{ const a=acc(id); if(a.pending) return `<b>${a.name}</b> · saldo por confirmar`; const nb=bal(a)+dl; return a.cls==='deuda'?`<b>${a.name}</b>: quedarás debiendo ${fmt(nb)}`:a.cls==='persona'?`<b>${a.name}</b> ${words(a,nb).w.toLowerCase()} ${words(a,nb).v}`:`<b>${a.name}</b> queda en ${fmt(nb)}`; };
  if(d.type==='GASTO'){ line('info', d.cat?`Cuenta como gasto de ${d.cat}.`:'Cuenta como gasto, sin categoría por ahora.'); line('wallet', after(d.acc,-d.amt)); }
  else if(d.type==='INGRESO'){ line('info',`Cuenta como ingreso de ${d.cat}.`); line('wallet', after(d.acc,d.amt)); }
  else if(d.type==='REEMBOLSO'){ line('info',`Se resta del gasto de ${d.cat} del mes en que llega.`); line('wallet', after(d.acc,d.amt)); }
  else if(d.type==='TRANSFERENCIA'){ const t=acc(d.to); line('info', t.cls==='deuda'?'No cuenta como gasto. Es un pago de tu tarjeta.':t.cls==='persona'?'No cuenta como gasto. Es un préstamo.':t.cls==='ahorro'?'No cuenta como gasto. Es plata apartada.':'No cuenta como gasto. Solo cambia de cuenta.'); line('wallet', after(d.from,-d.amt)); line('wallet', after(d.to,d.amt)); }
  else if(d.type==='AJUSTE'){ line('info','No cuenta como gasto ni ingreso. Es una deuda que existía antes de usar la app.'); line('wallet', `<b>${acc(d.to).name}</b> te debe ${fmt(d.amt)} desde antes`); }
  if(!d.date.startsWith(TODAY.slice(0,7))) line('cal', `<b>Se registra en ${MESES[dparts(d.date).m-1]}</b>, el mes en que ocurrió.`);
  return `<div class="conseq">${L.join('')}</div>`;
}

  let picker='';

    ${picker}
    ${q}
    ${d.type!=='?'?conseq(d):''}
    <div class="sheet-actions"><button class="btn quiet" type="button" data-a="close">Cancelar</button><button class="btn primary" type="button" data-a="register" ${canReg?'':'disabled style="opacity:.45"'}>${sh.edit?'Guardar cambios':'Registrar'}</button></div>`;
}
let regTimer=null;
function renderSheet(){
  const layer=document.getElementById('layer');
  if(!S.sheet){ layer.innerHTML=''; return; }
  const existing = layer.querySelector('.sheet');
  if(existing){ existing.innerHTML=sheetBody(); return; }
  layer.innerHTML=`<div class="layer" role="dialog" aria-modal="true" aria-label="Hoja de captura"><div class="scrim" data-a="close"></div><div class="sheet" id="sheet">${sheetBody()}</div></div>`;
  bindSwipe();
}
function closeSheet(){ clearTimeout(regTimer); S.sheet=null; renderSheet(); }
function bindSwipe(){
  const sh=document.getElementById('sheet'); if(!sh) return;
  let y0=null;
  sh.addEventListener('touchstart',e=>{ if(sh.scrollTop<=0) y0=e.touches[0].clientY; },{passive:true});
  sh.addEventListener('touchmove',e=>{ if(y0==null) return; const dy=e.touches[0].clientY-y0; if(dy>0) sh.style.transform=`translateY(${dy}px)`; },{passive:true});
  sh.addEventListener('touchend',e=>{ if(y0==null) return; const dy=e.changedTouches[0].clientY-y0; y0=null; if(dy>110) closeSheet(); else sh.style.transform=''; });
}

/* ---------- Render principal ---------- */
function cur(){ return S.stack[S.stack.length-1]; }
function render(keepScroll){
  const c=cur();
  const host=document.getElementById('host');
  const prev=host.querySelector('.screen');
  const top = keepScroll&&prev?prev.scrollTop:0;
  const isTab=TABS.includes(c.s);
  const full = c.s==='widget';
  host.innerHTML = full ? screens.widget() : `<div class="screen ${isTab?'':'no-tabs'}">${screens[c.s](c)}</div>`;
  const sc=host.querySelector('.screen'); if(sc) sc.scrollTop=top;
  const tb=document.getElementById('tabbar'), fab=document.getElementById('fab');
  tb.hidden=!isTab; fab.hidden=!isTab;
  if(isTab){
    tb.innerHTML=[['inicio','Inicio','home'],['movimientos','Movimientos','list'],['cuentas','Cuentas','wallet']].map(([s,n,ic])=>`<button class="tab ${c.s===s?'on':''}" type="button" data-a="tab" data-s="${s}" ${c.s===s?'aria-current="page"':''}>${I(ic)}${n}</button>`).join('');
    fab.innerHTML=I('plus')+'Registrar';
  }
}
function go(s,params){ S.ui={}; S.stack.push(Object.assign({s},params||{})); render(); }
function back(){ S.ui={}; if(S.stack.length>1) S.stack.pop(); else S.stack=[{s:'inicio'}]; render(); }
function tab(s){ S.ui={}; S.stack=[{s}]; render(); }
function toast(t){ const h=document.getElementById('toastHost'); h.innerHTML=`<div class="toast" role="status">${esc(t)}</div>`; clearTimeout(toast._t); toast._t=setTimeout(()=>h.innerHTML='',2200); }
const num = v => Number(String(v||'').replace(/[^\d]/g,''))||0;

/* ---------- Mapa de pantallas (solo prototipo) ---------- */
const MAP=[['widget','Widget / entrada de registro'],['__sheet','Hoja de captura'],['primeruso','Primer uso “¿Cuánto tienes hoy?”'],['inicio','Inicio'],['movimientos','Movimientos'],['movdetalle','Detalle de movimiento'],['resumen','Resumen del mes'],['cuentas','Cuentas'],['cuentadetalle','Detalle de cuenta'],['cuentaform','Nueva / editar cuenta'],['menu','Menú']];
function openMap(){
  const layer=document.getElementById('layer');
  layer.innerHTML=`<div class="mapbox" data-a="map-close"><div class="sheet"><div class="grab"></div><div class="sheet-head"><span class="label">Las 11 pantallas del Bloque 1</span><button class="iconbtn" type="button" data-a="map-close" aria-label="Cerrar">${I('x')}</button></div><ol>${MAP.map(([s,n],i)=>`<li><button type="button" data-a="map-go" data-s="${s}"><span>${i+1}</span>${n}</button></li>`).join('')}</ol><div class="note">Atajo solo del prototipo para revisar cada pantalla. En la app se llega por la navegación normal.</div></div></div>`;
}
function mapGo(s){
  document.getElementById('layer').innerHTML=''; S.sheet=null; S.ui={};
  if(s==='__sheet'){ S.stack=[{s:'inicio'}]; render(); useExample(0); return; }
  if(s==='widget'||s==='primeruso'){ S.stack=[{s}]; if(s==='primeruso') S.pu.step=1; render(); return; }
  if(TABS.includes(s)){ tab(s); return; }
  const base = {movdetalle:['movimientos',{id:'m13'}], resumen:['inicio',{}], cuentadetalle:['cuentas',{id:'nequi'}], cuentaform:['cuentas',{}], menu:['inicio',{}]}[s];
  S.stack=[{s:base[0]}];
  if(s==='cuentaform') S.form={name:'', cls:'disp', sub:'', unk:false};
  go(s, base[1]);
}

/* ---------- Eventos ---------- */
document.addEventListener('click', e=>{
  const el=e.target.closest('[data-a]'); if(!el) return;
  const a=el.dataset.a, id=el.dataset.id, s=el.dataset.s, v=el.dataset.v, k=el.dataset.k;
  switch(a){
    case 'go': go(s,{id}); break;
    case 'back': back(); break;
    case 'tab': if(s==='movimientos') S.filter={acc:'', cat:''}; tab(s); break;
    case 'map': openMap(); break;
    case 'map-close': if(e.target===el||el.tagName==='BUTTON') document.getElementById('layer').innerHTML=''; break;
    case 'map-go': mapGo(s); break;
    case 'toast': toast(el.dataset.t); break;
    case 'ui': S.ui[k]=!S.ui[k]; render(true); break;
    case 'toast-ui': S.ui[k]=false; render(true); toast(el.dataset.t); break;
    case 'month': { const [y,m]=S.month.split('-').map(Number); const nm=m+Number(el.dataset.d); S.month=`${y}-${String(nm).padStart(2,'0')}`; render(); break; }
    case 'f-clear-cat': S.filter.cat=''; render(true); break;
    case 'cat-filter': tab('movimientos'); S.filter={acc:'', cat:v}; render(); break;
    case 'ask-save': { const n=num(document.getElementById('askAmt').value); const q=acc('nequi'); q.ap=n; q.pending=false; render(true); toast('Nequi confirmada. Las cifras ya no son provisionales.'); break; }
    case 'ask-later': S.askLater=true; render(true); break;
    case 'pend-discard': S.pendiente.open=false; render(true); toast('Captura descartada'); break;
    case 'classify': S.classified[id]=v; S.ui={}; render(true); toast('Clasificado en '+v); break;
    case 'del': S.deleted.add(id); { const m=mov(id); if(m.type==='AJUSTE'){ const ac=acc(m.acc); ac.pending=true; ac.ap=null; } } back(); toast('Movimiento eliminado'); break;
    case 'confirm-save': { const ac=acc(id); ac.ap=(ac.cls==='deuda'?-1:1)*num(document.getElementById('confAmt').value); ac.pending=false; S.ui={}; render(true); toast('Saldo inicial confirmado'); break; }
    case 'archive': acc(id).archived=true; S.stack=[{s:'cuentas'}]; S.ui={}; render(); toast('Cuenta archivada. Está en el Menú.'); break;
    case 'reactivate': acc(id).archived=false; S.ui={}; render(true); toast('Cuenta reactivada'); break;
    case 'habitual': S.habitual=id; render(true); break;
    case 'newacc': S.form={name:'', cls:'disp', sub:'', unk:false}; go('cuentaform'); break;
    case 'acc-edit': { const ac=acc(id); S.form={id, name:ac.name, cls:ac.cls, sub:ac.sub}; go('cuentaform'); break; }
    case 'f-cls': S.form.cls=v; S.form.clsTouched=true; if(v==='deuda'&&!S.form.sub) S.form.sub='tarjeta'; render(true); break;
    case 'f-sub': S.form.sub=v; render(true); break;
    case 'f-ah': S.form.ah=v; S.form.cls = v==='apartada'?'ahorro':'disp'; render(true); break;
    case 'f-per': S.form.per=v; render(true); break;
    case 'f-save': { const f=S.form; const nm=(document.getElementById('fName').value||'').trim(); if(!nm){ toast('Escribe un nombre'); break; }
      if(f.id){ acc(f.id).name=nm; back(); toast('Nombre actualizado'); break; }
      const nid='n'+Date.now(); const amt=document.getElementById('fAmt'); let ap=amt?num(amt.value):0;
      if(f.cls==='deuda') ap=-ap; if(f.cls==='persona'&&f.per==='ledebo') ap=-ap;
      A.push({id:nid, name:nm, cls:f.cls, sub:f.cls==='deuda'?(f.sub||'tarjeta'):undefined, ap:f.unk?null:ap, pending:!!f.unk});
      S.stack.pop(); go('cuentadetalle',{id:nid}); toast('Cuenta creada (prototipo)'); break; }
    case 'pu-sel': S.pu.sel[id]=!S.pu.sel[id]; render(true); break;
    case 'pu-hab': S.pu.hab=id; render(true); break;
    case 'pu-next': if(S.pu.step===2){ Object.keys(S.pu.sel).forEach(i=>{const inp=document.getElementById('pu-'+i); if(inp&&!inp.disabled) S.pu.amt[i]=inp.value;}); } S.pu.step=Math.min(4,S.pu.step+1); render(); break;
    case 'pu-back': S.pu.step=Math.max(1,S.pu.step-1); render(); break;
    case 'pu-skip': case 'pu-done': tab('inicio'); if(a==='pu-skip') toast('Empiezas solo con Efectivo'); break;
    case 'sheet': openSheet(el.dataset.m, id); break;
    case 'close': closeSheet(); break;
    case 'ex': useExample(Number(el.dataset.i)); break;
    case 'to-typing': if(S.sheet.state==='registered') break; S.sheet.state='typing'; renderSheet(); setTimeout(()=>{const t=document.getElementById('phraseIn'); if(t) t.focus();},50); break;
    case 'interpret': { const t=document.getElementById('phraseIn').value.trim(); const i=EX.findIndex(x=>x.phrase===t.toLowerCase()); if(i>=0) useExample(i); else { S.sheet.phrase=t; renderSheet(); toast('El intérprete llega en otra iteración. Elige una frase de ejemplo.'); } break; }
    case 'pick': if(S.sheet.state==='registered') break; S.sheet.picker = S.sheet.picker===k?null:k; renderSheet(); if(k==='amt') setTimeout(()=>{const i=document.getElementById('amtIn'); if(i) i.focus();},50); break;
    case 'choose': { const d=S.sheet.d; if(k==='cat'){ d.cat=v; d.sub=(CATS.find(c=>c.n===v).subs||[])[0]; } else d[k]=v; if(S.sheet.prov) S.sheet.prov[k==='from'?'acc':k]=0; S.sheet.picker=null; renderSheet(); break; }
    case 'amt-ok': S.sheet.d.amt=num(document.getElementById('amtIn').value); S.sheet.prov.amt=0; S.sheet.picker=null; renderSheet(); break;
    case 'answer': { const d=S.sheet.d; if(v==='ahora'){ d.type='TRANSFERENCIA'; d.from=S.habitual; S.sheet.prov={acc:1}; } else { d.type='AJUSTE'; } S.sheet.state='card'; S.sheet.ask=null; renderSheet(); break; }
    case 'register': if(S.sheet.state!=='card') break;
      if(S.sheet.edit){ closeSheet(); toast('Cambios guardados (prototipo)'); break; }
      if(S.sheet.fromPend) S.pendiente.open=false;
      S.sheet.prev=JSON.parse(JSON.stringify({d:S.sheet.d,prov:S.sheet.prov,phrase:S.sheet.phrase}));
      S.sheet.state='registered'; S.sheet.picker=null; renderSheet(); clearTimeout(regTimer); regTimer=setTimeout(()=>{ closeSheet(); render(true); },3000); break;
    case 'undo': clearTimeout(regTimer); Object.assign(S.sheet,S.sheet.prev,{state:'card'}); if(S.sheet.fromPend) S.pendiente.open=true; renderSheet(); break;
  }
});
document.addEventListener('change', e=>{
  const el=e.target.closest('[data-c]'); if(!el) return;
  const c=el.dataset.c;
  if(c==='f-acc'){ S.filter.acc=el.value; render(true); }
  if(c==='f-cat'){ S.filter.cat=el.value; render(true); }
  if(c==='pu-unk'){ const i=el.dataset.id; const inp=document.getElementById('pu-'+i); if(inp&&!el.checked===false) S.pu.amt[i]=inp.value; S.pu.unk[i]=el.checked; render(true); }
  if(c==='f-unk'){ S.form.unk=el.checked; S.form.name=document.getElementById('fName').value; render(true); }
});
document.addEventListener('input', e=>{
  const el=e.target;
  if(el.dataset && el.dataset.c==='f-name' && S.form && !S.form.id){
    S.form.name=el.value;
    if(!S.form.clsTouched){ const d=deduce(el.value); const changed = d.cls!==S.form.cls || (d.sub||'')!==(S.form.sub||'') || !!d.askAhorro!==!!S.form.askAh; if(changed){ S.form.cls = S.form.ah==='apartada'&&d.askAhorro?'ahorro':d.cls; S.form.sub=d.sub||''; S.form.askAh=!!d.askAhorro; const pos=el.selectionStart; render(true); const n=document.getElementById('fName'); n.focus(); n.setSelectionRange(pos,pos); } }
  }
});
document.addEventListener('keydown', e=>{ if(e.key==='Escape'){ if(S.sheet) closeSheet(); else document.getElementById('layer').innerHTML=''; } });

/* Arranque: #inicio, #widget, #primeruso, #movimientos, #cuentas, #resumen, #menu */
const h=(location.hash||'').slice(1);
if(h==='widget'||h==='primeruso') S.stack=[{s:h}];
else if(TABS.includes(h)) S.stack=[{s:h}];
else if(h==='resumen'||h==='menu') S.stack=[{s:'inicio'},{s:h}];
render();
})();
</script>

</body></html>
